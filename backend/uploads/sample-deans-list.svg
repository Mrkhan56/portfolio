<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="goldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#292524" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <rect width="800" height="560" fill="url(#goldBg)" rx="16"/>
  <rect x="25" y="25" width="750" height="510" fill="none" stroke="#44403c" stroke-width="2" rx="12"/>
  <rect x="28" y="28" width="744" height="6" fill="url(#goldGrad)" rx="3"/>

  <!-- Academic Star Medal -->
  <circle cx="400" cy="115" r="45" fill="#292524" stroke="#f59e0b" stroke-width="3"/>
  <polygon points="400,85 410,107 433,107 414,121 421,143 400,129 379,143 386,121 367,107 390,107" fill="#fbbf24"/>

  <!-- Texts -->
  <text x="400" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#f59e0b" text-anchor="middle" letter-spacing="4">ACADEMIC EXCELLENCE RECOGNITION</text>
  <text x="400" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">Dean's Honor List Citation</text>
  <text x="400" y="270" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="500" fill="#d6d3d1" text-anchor="middle">School of Computing &amp; Data Sciences</text>

  <rect x="300" y="295" width="200" height="32" rx="16" fill="#44403c" stroke="#f59e0b" stroke-width="1"/>
  <text x="400" y="316" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#fde047" text-anchor="middle">GPA: 3.98 / 4.00 • Top 1%</text>

  <text x="400" y="365" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#e7e5e4" text-anchor="middle">Conferred for sustained distinguished scholastic achievement and outstanding</text>
  <text x="400" y="388" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#e7e5e4" text-anchor="middle">academic performance during the academic year 2024-2025.</text>

  <line x1="200" y1="430" x2="600" y2="430" stroke="#44403c" stroke-width="1"/>

  <text x="240" y="465" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#a8a29e" text-anchor="middle">SEMESTER</text>
  <text x="240" y="488" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#f8fafc" text-anchor="middle">Fall 2024 / Spring 2025</text>

  <text x="400" y="465" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#a8a29e" text-anchor="middle">CITATION NO</text>
  <text x="400" y="488" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">HON-2025-0412</text>

  <text x="560" y="465" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#a8a29e" text-anchor="middle">HONOR</text>
  <text x="560" y="488" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#fbbf24" text-anchor="middle">Highest Distinction</text>
</svg>
