<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFF2A3" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="560" fill="url(#bgGrad)" rx="12"/>
  
  <!-- Ornate Border -->
  <rect x="20" y="20" width="760" height="520" fill="none" stroke="#D4AF37" stroke-width="4" rx="8"/>
  <rect x="30" y="30" width="740" height="500" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="8 4" rx="6"/>

  <!-- University Seal / Emblem -->
  <circle cx="400" cy="95" r="38" fill="url(#goldGrad)" stroke="#1e293b" stroke-width="2"/>
  <circle cx="400" cy="95" r="30" fill="#1e1b4b"/>
  <path d="M400 78 L410 98 L390 98 Z" fill="#facc15"/>
  <polygon points="400,75 412,98 388,98" fill="#fef08a"/>
  <rect x="385" y="99" width="30" height="4" fill="#fef08a" rx="2"/>

  <!-- Header -->
  <text x="400" y="165" font-family="'Georgia', serif" font-size="28" font-weight="bold" fill="#0f172a" text-anchor="middle" letter-spacing="3">UNIVERSITY OF TECHNOLOGY &amp; SCIENCE</text>
  <text x="400" y="190" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="2">OFFICIAL ACADEMIC DEGREE CONFERRAL</text>

  <line x1="250" y1="205" x2="550" y2="205" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Body Text -->
  <text x="400" y="240" font-family="'Georgia', serif" font-style="italic" font-size="16" fill="#475569" text-anchor="middle">This is to certify that the degree of</text>
  
  <text x="400" y="280" font-family="'Georgia', serif" font-size="24" font-weight="bold" fill="#1e3a8a" text-anchor="middle">BACHELOR OF SCIENCE</text>
  <text x="400" y="310" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">COMPUTER SCIENCE &amp; ENGINEERING</text>
  
  <text x="400" y="350" font-family="'Georgia', serif" font-style="italic" font-size="15" fill="#475569" text-anchor="middle">has been officially conferred with all rights, honors, and privileges thereunto appertaining.</text>
  
  <rect x="260" y="375" width="280" height="34" rx="17" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="400" y="398" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">Summa Cum Laude • CGPA 3.92 / 4.00</text>

  <!-- Signatures and Footer -->
  <line x1="120" y1="480" x2="280" y2="480" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="200" y="472" font-family="'Brush Script MT', cursive, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">Dean J. Vance</text>
  <text x="200" y="498" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">DEAN OF FACULTY</text>

  <!-- Gold Seal Ribbon on Right -->
  <circle cx="400" cy="470" r="28" fill="url(#goldGrad)" stroke="#b45309" stroke-width="2"/>
  <circle cx="400" cy="470" r="22" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="400" y="475" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" fill="#b45309" text-anchor="middle">VERIFIED</text>

  <line x1="520" y1="480" x2="680" y2="480" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="600" y="472" font-family="'Brush Script MT', cursive, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">Dr. Arthur Pendelton</text>
  <text x="600" y="498" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">PRESIDENT &amp; CHANCELLOR</text>

  <text x="400" y="535" font-family="'Courier New', monospace" font-size="10" fill="#94a3b8" text-anchor="middle">REGISTRATION NO: DEG-2024-88419 • ISSUED JUNE 2024</text>
</svg>

